        enabled: true
        spool-directory: './build/qa-receipts'
        max-records-per-file: 1000
        max-open-duration: PT30S
        queue-capacity: 10000
        upload-enabled: true
        upload-interval: PT1M
        prefix: 'receipts'
    documents:
        prefix: 'documents'
        max-canonical-bytes: 10485760
        max-framed-bytes: 10485760
        db-storage-threshold-bytes: 0
        shape-cache-ttl: PT30S
        alias-cache-ttl: PT5M
    body-fetch:
        permits:
            cache: 10
            database: 4
            s3: 10
        total-timeout: PT1S
        concurrency:
            disk: 10
            s3: 10
        cache:
            directory: './build/body-cache'
            encrypted-volume-expected: true
            maximum-bytes: 1073741824
            idle-ttl: PT1H
            high-watermark-percent: 90
            low-watermark-percent: 75
            cleanup-interval: PT1M
    backfill:
        system-identity-version-id: 1
        reconciliation:
            batch-limit: 200
        worker:
            enabled: true
            id: claim-backfill-worker
            lease-timeout: PT5M
            retry-ceiling: 5
            batch-size: 100
        schedule:
            enabled: true
            worker-interval: PT60S
            reconciliation-interval: PT5M
            max-jobs-per-run: 10
    rate-limiter:
        enabled: true
        pre-auth:
            enabled: true
            limits:
                - { capacity: 50, window: PT5S }
                - { capacity: 150, window: PT30S }
        post-auth:
            enabled: true
            credential:
                CORE: { limits: [{ capacity: 300, window: PT10S }, { capacity: 3000, window: PT1M }] }
                ADMIN: { limits: [{ capacity: 30, window: PT10S }, { capacity: 300, window: PT1M }] }
            tenant:
                CORE: { limits: [{ capacity: 1000, window: PT10S }, { capacity: 10000, window: PT1M }] }
                ADMIN: { limits: [{ capacity: 100, window: PT10S }, { capacity: 1000, window: PT1M }] }
        cache:
            maximum-size: 100000
            expire-after-access: PT10M

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: alpha
        tags-sorter: alpha
        display-request-duration: true
        doc-expansion: none
    show-actuator: false
    packages-to-scan: eu.davide.features

management:
    endpoints:
        web:
            exposure:
                include: mappings,health,info
    endpoint:
        health:
            show-details: always
